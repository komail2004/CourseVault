[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "coursevault"
version = "0.1.0"
description = "Local-first Canvas course archive"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6,<7", "playwright>=1.45,<2", "beautifulsoup4>=4.12,<5"]
[project.scripts]
coursevault = "coursevault.app:main"
[tool.setuptools.packages.find]
where = ["src"]
