name: Desktop builds
on:
  workflow_dispatch:
jobs:
  package:
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pyinstaller
      - run: python -m playwright install chromium
      - run: pyinstaller --noconfirm --windowed --name CourseVault --collect-all playwright src/coursevault/app.py
      - uses: actions/upload-artifact@v4
        with:
          name: CourseVault-${{ matrix.os }}
          path: dist/
