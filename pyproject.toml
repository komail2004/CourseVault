[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coursevault"
version = "0.2.0"
description = "Browser-based Canvas course archive"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.45,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.6,<7"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
coursevault = "coursevault.web:main"
coursevault-desktop = "coursevault.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coursevault = ["web_index.html"]
